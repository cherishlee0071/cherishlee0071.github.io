<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiashuo Li (李佳朔)</title>
    <style>
        /* ===== 全局样式重置与基础设置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1E3A8A;      /* 深蓝色主色调 */
            --primary-light: #3B5998;      /* 浅蓝色 */
            --primary-dark: #0F1F4D;       /* 更深的蓝色 */
            --bg-color: #F3F4F6;           /* 浅灰色背景 */
            --card-bg: #FFFFFF;            /* 卡片白色背景 */
            --text-primary: #1F2937;       /* 主要文字颜色 */
            --text-secondary: #6B7280;     /* 次要文字颜色 */
            --border-color: #E5E7EB;       /* 边框颜色 */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.15);
            --radius: 12px;                /* 圆角半径 */
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== 头部区域 ===== */
        header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            box-shadow: var(--shadow-md);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: 1px;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
        }

        
    </style>
</head>
<body>
    <!-- 头部 -->
    <header>
        <h1>404</h1>
        <p>404 founded but you can't see it</p>
    </header>

        
    
</body>
</html>
